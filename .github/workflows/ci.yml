name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  data-factory:
    name: Data Factory (pipeline + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data/factory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Tests unitaires
        run: python -m pytest -q
      - name: Exécuter le pipeline de bout en bout (fixtures)
        run: python run.py
      - name: Vérifier la sortie Gold
        run: test -f gold/communes_prix_m2.geojson
      - uses: actions/upload-artifact@v4
        with:
          name: gold-output
          path: data/factory/gold/

  api:
    name: API (import + smoke)
    runs-on: ubuntu-latest
    needs: data-factory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Régénérer les données de service
        working-directory: data/factory
        run: pip install -r requirements.txt && python run.py
      - name: Installer l'API
        working-directory: apps/api
        run: pip install -r requirements.txt httpx
      - name: Smoke test des endpoints
        working-directory: apps/api
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import app
          c = TestClient(app)
          assert c.get("/health").json()["status"] == "ok"
          assert c.get("/api/meta").json()["communes_with_data"] >= 1
          assert len(c.get("/api/communes").json()["features"]) >= 1
          assert c.get("/api/communes/33063").json()["prix_m2"] > 0
          print("API smoke OK")
          PY

  web:
    name: Web (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run build
